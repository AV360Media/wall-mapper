# Publishes the committed index.html (production) and index.test.html (test) to GitHub Pages
# whenever either changes on main. index.test.html is rebuilt with every change; index.html only
# changes when the test build is promoted, so production moves only on that command.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths: [index.html, index.test.html]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p site && cp index.html index.test.html site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
